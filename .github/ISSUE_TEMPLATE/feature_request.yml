name: Feature Request
description: Suggest a new sensor or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for the suggestion! Please provide as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Describe the feature
      description: What would you like to see added or changed?
    validations:
      required: true

  - type: textarea
    id: nightscout_api
    attributes:
      label: Nightscout API reference
      description: |
        If you know which Nightscout API endpoint provides this data, please share it.
        You can explore your endpoints at `https://your-ns-url/api/v1/`
      placeholder: "e.g. /api/v1/treatments?find[eventType]=Temp+Basal"

  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: How would you use this in Home Assistant? (automations, dashboard, etc.)
    validations:
      required: true
