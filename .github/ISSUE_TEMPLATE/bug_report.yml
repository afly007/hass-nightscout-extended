name: Bug Report
description: Report a bug or unexpected behaviour
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.

  - type: input
    id: version
    attributes:
      label: Integration version
      description: Found in HACS → Integrations → Nightscout Extended
      placeholder: "e.g. 1.0.2"
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "e.g. 2026.3.4"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: |
        Enable debug logging and paste any relevant entries here.
        Add the following to `configuration.yaml` then restart HA:
        ```yaml
        logger:
          logs:
            custom_components.nightscout_extended: debug
        ```
      render: text

  - type: input
    id: uploader
    attributes:
      label: Nightscout uploader
      description: e.g. Loop, xDrip+, AndroidAPS, Trio
      placeholder: "e.g. Loop"
